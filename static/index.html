<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Puck Office 个人待办和笔记。" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Puck Office · 待办</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="todos">
  <a class="skip-link" href="#content">跳到内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Puck Office</a>
      <nav class="main-nav" aria-label="主导航">
        <a class="active" href="/" aria-current="page">待办</a>
        <a href="/countdowns.html">倒数日</a>
        <a href="/notes.html">笔记</a>
      </nav>
      <button id="logoutButton" class="logout-btn" type="button">退出</button>
    </div>
  </header>

  <main id="content" class="shell">
    <section class="page-head">
      <div>
        <p class="eyebrow">Todo</p>
        <h1>待办</h1>
      </div>
      <div class="month-card" aria-label="月份选择">
        <button id="prevMonth" class="ghost-btn" type="button" title="上个月">‹</button>
        <input id="monthPicker" type="month" />
        <button id="nextMonth" class="ghost-btn" type="button" title="下个月">›</button>
      </div>
    </section>

    <section class="panel composer">
      <div class="panel-head compact-head">
        <h2>新增待办</h2>
      </div>
      <form id="todoForm" class="form-grid">
        <label class="field title-field">
          <span>事项</span>
          <input id="titleInput" type="text" maxlength="120" placeholder="准备项目周报" required />
        </label>
        <label class="field">
          <span>优先级</span>
          <select id="priorityInput">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
            <option value="urgent">紧急</option>
          </select>
        </label>
        <label class="field">
          <span>截止</span>
          <input id="dueInput" type="datetime-local" required />
        </label>
        <label class="field note-field">
          <span>备注</span>
          <textarea id="noteInput" rows="3" maxlength="2000"></textarea>
        </label>
        <button class="primary-btn" type="submit">添加</button>
      </form>
    </section>

    <section class="columns todo-columns">
      <section class="panel list-panel">
        <div class="panel-head">
          <div>
            <h2>未完成</h2>
            <p id="pendingMeta">Loading...</p>
          </div>
        </div>
        <div id="pendingList" class="todo-list"></div>
      </section>

      <section class="panel list-panel completed-panel">
        <div class="panel-head">
          <div>
            <h2>已完成</h2>
            <p id="completedMeta">Loading...</p>
          </div>
        </div>
        <div id="completedList" class="todo-list"></div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="editModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="panel-head modal-head">
        <div>
          <h2 id="editTitle">编辑待办</h2>
        </div>
        <button id="closeEditModal" class="ghost-btn modal-close" type="button" aria-label="关闭编辑窗口">×</button>
      </div>
      <form id="editForm" class="form-grid edit-form">
        <label class="field title-field">
          <span>事项</span>
          <input id="editTitleInput" type="text" maxlength="120" required />
        </label>
        <label class="field">
          <span>优先级</span>
          <select id="editPriorityInput">
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="urgent">紧急</option>
          </select>
        </label>
        <label class="field">
          <span>截止</span>
          <input id="editDueInput" type="datetime-local" required />
        </label>
        <label class="field note-field">
          <span>备注</span>
          <textarea id="editNoteInput" rows="3" maxlength="2000"></textarea>
        </label>
        <div class="edit-actions">
          <button id="cancelEdit" class="ghost-action" type="button">取消</button>
          <button class="primary-btn" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
