<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Puck Office Markdown 笔记。" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Puck Office · 笔记</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="notes">
  <a class="skip-link" href="#content">跳到内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Puck Office</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/">待办</a>
        <a class="active" href="/notes.html" aria-current="page">笔记</a>
      </nav>
    </div>
  </header>

  <main id="content" class="shell">
    <section class="page-head">
      <div>
        <p class="eyebrow">Notes</p>
        <h1>笔记</h1>
      </div>
      <p id="notesMeta" class="page-meta">Loading...</p>
    </section>

    <section id="notesFinder" class="finder-shell drawer-collapsed">
      <div class="finder-toolbar">
        <div class="traffic-lights" aria-hidden="true">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>
        <button id="toggleNotesDrawer" class="finder-toggle" type="button" aria-controls="notesDrawer" aria-expanded="false">笔记</button>
      </div>

      <div class="finder-body">
        <aside id="notesDrawer" class="notes-drawer" aria-label="笔记文件">
          <div id="notesList" class="notes-list finder-icon-grid"></div>
        </aside>

        <section class="finder-workspace">
          <form id="noteForm" class="note-form">
            <label class="field">
              <span>标题</span>
              <input id="noteTitleInput" type="text" maxlength="120" placeholder="今日复盘" required />
            </label>
            <div class="note-editor">
              <label class="field editor-field">
                <span>Markdown</span>
                <textarea id="noteMarkdownInput" rows="18" maxlength="20000" placeholder="# 标题&#10;&#10;- 记录要点&#10;- **重点**"></textarea>
              </label>
              <div class="preview-wrap">
                <span>预览</span>
                <div id="notePreview" class="markdown-preview empty-preview">开始输入后显示预览。</div>
              </div>
            </div>
            <div class="note-actions">
              <button id="cancelNoteEdit" class="ghost-action hidden" type="button">取消</button>
              <button id="saveNoteButton" class="primary-btn" type="submit">保存</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
