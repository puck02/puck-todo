<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Puck Office Markdown 笔记。" />
  <meta name="theme-color" content="#f4f0e8" />
  <title>Puck Office · 笔记</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-page="notes">
  <a class="skip-link" href="#content">跳到内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Puck Office</a>
      <nav class="main-nav" aria-label="主导航">
        <a href="/">待办</a>
        <a class="active" href="/notes.html" aria-current="page">笔记</a>
      </nav>
      <button id="logoutButton" class="logout-btn" type="button">退出</button>
    </div>
  </header>

  <main id="content" class="shell notes-shell">
    <section id="folderView" class="finder-shell folder-view">
      <div class="finder-toolbar">
        <div class="traffic-lights" aria-hidden="true">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>
        <nav id="breadcrumb" class="breadcrumb" aria-label="路径"></nav>
        <p id="notesMeta" class="finder-count">Loading...</p>
        <div class="finder-actions">
          <button id="newItemButton" class="finder-toggle" type="button" aria-haspopup="menu" aria-expanded="false">新建</button>
          <div id="newItemMenu" class="finder-menu hidden" role="menu">
            <button type="button" role="menuitem" data-create-type="file">文件</button>
            <button type="button" role="menuitem" data-create-type="folder">文件夹</button>
          </div>
        </div>
      </div>
      <div class="folder-stage">
        <div id="notesList" class="notes-list finder-icon-grid"></div>
      </div>
    </section>

    <section id="editorView" class="editor-view hidden">
      <div class="editor-toolbar">
        <button id="backToFolder" class="ghost-action" type="button">返回</button>
        <input id="noteTitleInput" type="text" maxlength="120" placeholder="未命名" form="noteForm" required />
        <button id="saveNoteButton" class="primary-btn" type="submit" form="noteForm">保存</button>
      </div>
      <form id="noteForm" class="note-form editor-form">
        <div class="preview-wrap">
          <span>预览</span>
          <div id="notePreview" class="markdown-preview empty-preview">开始输入后显示预览。</div>
        </div>
        <label class="field editor-field">
          <span>Markdown</span>
          <textarea id="noteMarkdownInput" rows="20" maxlength="20000" placeholder="# 标题&#10;&#10;- 记录要点&#10;- **重点**"></textarea>
        </label>
      </form>
    </section>
  </main>

  <div id="contextMenu" class="context-menu hidden" role="menu">
    <button id="deleteContextItem" type="button" role="menuitem">删除</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
